[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "playo"
version = "0.1.0"
description = "CLI music player synced with a Telegram channel + synced lyrics (LRCLIB)"
requires-python = ">=3.9"
dependencies = [
    "telethon>=1.34",
    "pygame>=2.5",
    "mutagen>=1.46",
    "requests>=2.31",
    "colorama>=0.4.6",
]

[project.scripts]
playo = "playo.cli:main"

[tool.setuptools]
packages = ["playo"]
